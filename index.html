<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="LogoGaul.png">
<title>GAUL — Archives du site web</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --accent: #4fa3ff;

    
    --text: #e8edf5;
    --muted: #93a1b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg), #060a14);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    padding: 40px 20px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 36px; text-align: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 900px;
    width: 100%;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid #223052;
    border-radius: 10px;
    padding: 22px 18px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  a.card .label {
    display: block;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  a.card .desc {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
  }
  a.card.primary {
    grid-column: 1 / -1;
    background: #16233d;
    border-color: var(--accent);
  }
  footer {
    margin-top: 40px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Archives GAUL - Anciens sites web</h1>
  
  <div class="grid">
    <a class="card" href="www.migration_fsg/index.html">
      <span class="label">Archive — Version 5</span>
      <span class="desc">www.migration_fsg</span>
    </a>
    <a class="card" href="Old_www4/index.html">
      <span class="label">Archive — Version 4</span>
      <span class="desc">Old_www4</span>
    </a>
    <a class="card" href="Old_www3/index.htm">
      <span class="label">Archive — Version 3</span>
      <span class="desc">Old_www3</span>
    </a>
    <a class="card" href="Old_www2/index.html">
      <span class="label">Archive — Version 2</span>
      <span class="desc">Old_www2</span>
    </a>
    <a class="card" href="Old_www1/index.html">
      <span class="label">Archive — Version 1</span>
      <span class="desc">Old_www1</span>
    </a>
  </div>

</body>
</html>
